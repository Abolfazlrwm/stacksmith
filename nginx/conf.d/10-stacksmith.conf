# docubot reverse proxy. The upstream is included from
# /etc/nginx/upstreams.conf (a bind-mounted file) so a deploy can switch the
# active slot by rewriting that file and reloading - never by touching this.

include /etc/nginx/upstreams.conf;

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        return 200 "ok";
    }

    location / {
        proxy_pass http://docubot_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
