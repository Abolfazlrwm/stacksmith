# docubot reverse proxy. The upstream is included from
# /etc/nginx/upstreams.conf (a bind-mounted file) so a deploy can switch the
# active slot by rewriting that file and reloading - never by touching this.
#
# TLS: production uses real certificates (certbot, see the operations
# runbook); local and CI generate a self-signed pair via `make certs`.

include /etc/nginx/upstreams.conf;

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        return 200 "ok";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # docubot ingests documents; keep room for real uploads
    client_max_body_size 25m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /nginx-health {
        return 200 "ok";
    }

    location / {
        proxy_pass http://docubot_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
