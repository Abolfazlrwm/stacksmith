# Reverse proxy for the docubot stack.
# TLS is terminated here; the backend speaks plain HTTP on :8000.
# upstreams.conf is auto-included by the default nginx.conf.

# Rate limiting zone for health probes.
limit_req_zone $binary_remote_addr zone=health:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # ACME challenge passthrough for cert renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health probes (proxied to the app).
    location = /health/live/ {
        proxy_pass http://app-backend/health/live/;
    }
    location = /health/ready/ {
        proxy_pass http://app-backend/health/ready/;
    }
    location = /health {
        proxy_pass http://app-backend/health/live/;
        limit_req zone=health burst=20 nodelay;
    }

    # nginx stub_status — scraped by nginx-exporter on the internal
    # network only. The /stub_status endpoint returns active connections,
    # accepts, handled, and requests — the raw input the SLI dashboard's
    # request-rate and error-budget panels need. Access is restricted to
    # private ranges so it is not reachable from the public internet
    # even though nginx listens on :80.
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml image/svg+xml;

    # Body limits
    client_max_body_size 25m;

    # App
    location / {
        proxy_pass http://app-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
