# Minimal nginx config — Phase 1, commit 1.
# Enhanced with TLS, gzip and security headers in a later commit.

server {
    listen 80;
    server_name _;

    location = /health {
        proxy_pass http://app:8000/health/live/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
