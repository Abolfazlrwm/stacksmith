---
name: logs-drill

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs-drill:
    name: loki ready → ingest → query
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cp .env.example .env
          sed -i 's/DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production-0123456789/' .env
          sed -i 's/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-test-password/' .env
          sed -i 's/DJANGO_ALLOWED_HOSTS=.*/DJANGO_ALLOWED_HOSTS=*/' .env
          sed -i 's/NGINX_HTTP_PORT=.*/NGINX_HTTP_PORT=8085/' .env
          sed -i 's/GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=ci-grafana/' .env
          sed -i 's/GRAFANA_PORT=.*/GRAFANA_PORT=3001/' .env

      - name: Bring up the stack and the monitoring overlay
        run: |
          docker compose -f docker-compose.prod.yml up -d --build --wait
          # Monitoring overlay: do not use --wait (loki healthcheck is slow).
          docker compose -f docker-compose.monitoring.yml up -d

      - name: Wait for Loki to be up
        run: |
          # /metrics responds as soon as Loki's HTTP server is up.
          # /ready can take 60-120s to return 200 (ring join, compactor init);
          # we do not block on it — the query step proves Loki is functional.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/metrics 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "loki /metrics responding (HTTP $code) after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "loki /metrics never responded"
          docker compose -f docker-compose.monitoring.yml logs loki
          exit 1

      - name: Generate a log line (hit the app through nginx)
        run: |
          curl -fsS http://127.0.0.1:8085/health/live/ | grep -q '"alive"'
          # Give promtail a few seconds to scrape and ship.
          sleep 5

      - name: Query Loki for the app's log lines
        run: |
          set -euo pipefail
          # Query Loki for any log line from the stacksmith project in the last 5m.
          resp=$(curl -s -G "http://127.0.0.1:3100/loki/api/v1/query_range" \
            --data-urlencode 'query={project="stacksmith"}' \
            --data-urlencode 'limit=10' \
            --data-urlencode "start=$(($(date +%s) - 300))000000000" \
            --data-urlencode "end=$(($(date +%s) + 60))000000000")
          echo "loki response: $resp"
          count=$(echo "$resp" | jq -r '.data.result | length')
          if [ "$count" -eq 0 ]; then
            echo "no log lines ingested — promtail may not be scraping"
            docker compose -f docker-compose.monitoring.yml logs promtail
            exit 1
          fi
          echo "loki ingested $count log stream(s) from the stacksmith project"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.prod.yml logs --no-color || true
          docker compose -f docker-compose.monitoring.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.monitoring.yml down --remove-orphans -v || true
          docker compose -f docker-compose.prod.yml down --remove-orphans -v || true
