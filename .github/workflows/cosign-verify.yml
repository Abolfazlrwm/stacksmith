---
name: cosign-verify

# Verifies that the latest GHCR image has a valid cosign signature
# before it can be deployed. This closes the supply-chain loop:
# sign (cosign-sign) → verify (this workflow) → deploy.
#
# This workflow is a HARD gate and therefore deliberately narrow: it only
# touches the image SIGNATURE, which answered fast in every run of
# 2026-11-17. The build-attestation check lives in its own soft workflow
# (cosign-attest.yml): on that date the GHCR *read* path from GitHub-hosted
# runners intermittently blackholed (cosign verify-attestation AND syft both
# wedged; meanwhile pushes/attests/signs - the write path - always worked,
# and the same reads succeeded in seconds from other networks). A wedged
# runner burns its whole job clock and is killed by GitHub with conclusion
# "cancelled" - logs never upload - so the wedge-prone check must never run
# inside a hard-gate workflow.
on:
  workflow_run:
    workflows: ["cosign-sign"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  verify:
    name: verify cosign signature on latest image
    runs-on: ubuntu-latest
    # Signature worst case is 10 min (3 x (160 s call + 60 s sleep)); 20 gives
    # 2x headroom. Note: GitHub enforces timeout-minutes on a ~5-min cadence,
    # so the kill actually lands at ~25 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (read-only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: |
          IMG="ghcr.io/${{ github.repository }}/app"
          echo "name=$(echo "$IMG" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Verify the signature
        run: |
          IMG="${{ steps.image.outputs.name }}"
          echo "Verifying signature on $IMG:latest"
          # `timeout -k 10 N` is essential: plain `timeout N` only sends
          # SIGTERM and then waits for the child forever, and a cosign call
          # stuck in a blackholed connection ignores SIGTERM. `-k 10`
          # escalates to SIGKILL, so a call can never outlive N+10 seconds.
          # Healthy registry answers in ~1 s (observed in every successful
          # run); only transient propagation lag (minutes) needs retries.
          for ATTEMPT in 1 2 3; do
            if timeout -k 10 150 cosign verify \
              --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/.+" \
              --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
              "$IMG:latest"; then
              echo "Signature verified (attempt $ATTEMPT) — image is safe to deploy"
              exit 0
            fi
            echo "verify attempt $ATTEMPT failed - retrying in 60s"
            sleep 60
          done
          echo "cosign verify failed after 3 attempts" >&2
          exit 1
