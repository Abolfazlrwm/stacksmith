---
name: cosign-verify

# Verifies that the latest GHCR image has a valid cosign signature
# before it can be deployed. This closes the supply-chain loop:
# sign (cosign-sign) → verify (this workflow) → deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  verify:
    name: verify cosign signature on latest image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (read-only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: |
          IMG="ghcr.io/${{ github.repository }}/app"
          echo "name=$(echo "$IMG" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Verify the signature
        run: |
          IMG="${{ steps.image.outputs.name }}"
          echo "Verifying signature on $IMG:latest"
          cosign verify \
            --certificate-identity-regexp \
            "https://github.com/${{ github.repository }}/.github/.+" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com" \
            "$IMG:latest"
          echo "Signature verified — image is safe to deploy"

      - name: Verify SBOM attestation
        run: |
          IMG="${{ steps.image.outputs.name }}"
          echo "Verifying SBOM attestation on $IMG:latest"
          cosign verify-attestation \
            --certificate-identity-regexp \
            "https://github.com/${{ github.repository }}/.github/.+" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com" \
            --type spdxjson \
            "$IMG:latest"
          echo "SBOM attestation verified"
