---
name: lint

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Lint all YAML
        run: yamllint .

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck every script
        run: |
          status=0
          for f in scripts/*.sh; do
            [ -e "$f" ] || continue
            echo ":: shellcheck $f"
            shellcheck -x "$f" || status=1
          done
          exit "$status"

  compose-config:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          set -euo pipefail
          for f in tests/smoke/docker-compose.yml docker-compose.prod.yml; do
            [ -f "$f" ] || continue
            echo ":: validating $f"
            docker compose -f "$f" config -q
          done
