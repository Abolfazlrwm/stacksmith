---
name: lint

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read


concurrency:
  # Cancel in-progress runs of this workflow on the same ref when a new
  # commit lands. A fast push cadence otherwise queues stale runs that
  # finish minutes after the developer moved on — wasting CI minutes.
  # Different branches / different PRs get their own group, so they do
  # not interfere with each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Lint all YAML
        run: yamllint .

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck every script
        run: |
          status=0
          for f in scripts/*.sh; do
            [ -e "$f" ] || continue
            echo ":: shellcheck $f"
            shellcheck -x "$f" || status=1
          done
          exit "$status"

  compose-config:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write CI .env
        run: cp .env.example .env
      - name: Validate compose files
        run: |
          set -euo pipefail
          for f in tests/smoke/docker-compose.yml \
            docker-compose.prod.yml docker-compose.monitoring.yml; do
            [ -f "$f" ] || continue
            echo ":: validating $f"
            docker compose -f "$f" config -q
          done
          # Overlays must be validated with the base file.
          echo ":: validating docker-compose.prod.yml + docker-compose.tls.yml"
          docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml config -q
