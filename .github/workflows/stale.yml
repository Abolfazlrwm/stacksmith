---
name: stale

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: close stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v9
        with:
          # Issues inactive for 30 days get a warning, closed after 7 more.
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: stale
          stale-issue-message: |
            This issue has been inactive for 30 days. It will be closed in
            7 days unless there is new activity. If it is still relevant,
            comment to keep it open.
          close-issue-message: |
            Closed automatically after 37 days of inactivity. Reopen if
            still relevant.
          # PRs inactive for 14 days get a warning, closed after 7 more.
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: |
            This PR has been inactive for 14 days. It will be closed in
            7 days unless there is new activity. If it is still being
            worked on, push a commit or comment.
          close-pr-message: |
            Closed automatically after 21 days of inactivity. Reopen if
            still being worked on.
          # Exempt pinned issues and PRs with the "pinned" label.
          exempt-issue-labels: pinned,roadmap
          exempt-pr-labels: pinned,roadmap
          # Operations per run (avoid rate limits).
          operations-per-run: 30
