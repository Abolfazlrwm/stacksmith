---
name: markdownlint

# Lint every Markdown file in the repo.
# Catches trailing whitespace, missing code-fence languages, broken
# heading hierarchy, and overly long lines.
on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - '.github/workflows/markdownlint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint.json'

permissions:
  contents: read


concurrency:
  # Cancel in-progress runs of this workflow on the same ref when a new
  # commit lands. A fast push cadence otherwise queues stale runs that
  # finish minutes after the developer moved on — wasting CI minutes.
  # Different branches / different PRs get their own group, so they do
  # not interfere with each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  markdownlint:
    name: markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
            !node_modules/**
            !commitlint/node_modules/**
            !tests/demo-corpus/**
          config: .markdownlint.json
