---
name: commitlint

# Enforce Conventional Commits on every PR.
# Two checks:
#   1. PR title must match  type(scope?): subject
#   2. Every commit on the PR branch must match the same format
#
# This is the gate that keeps the git history machine-readable, which in
# turn lets release-drafter categorize PRs automatically (see ADR-0032).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: '^[a-z].+'
          subjectPatternError: |
            The subject (text after the colon) must start with a lowercase
            letter and use the imperative mood: "add X", not "added X".
          # WIP PRs are allowed to skip the check.
          wip: true

  commit-messages:
    name: commit messages follow Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint deps
        run: |
          cd commitlint
          # No package-lock.json checked in (intentional — the main repo
          # stays Python+Shell), so use npm install, not npm ci.
          npm install --no-fund --no-audit

      - name: Lint commit messages on this branch
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          (cd commitlint && npx commitlint --from="$BASE" --to="$HEAD" --verbose)
