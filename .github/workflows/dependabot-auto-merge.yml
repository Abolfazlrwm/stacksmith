---
name: dependabot-auto-merge

# Automatically merges Dependabot PRs for patch and minor bumps
# that pass CI. Major bumps are left for manual review.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  # Creating/applying repository labels (gh label create, gh pr edit
  # --add-label) goes through the issues API, which needs issues:write.
  # Without it the major-bump labeling step fails with a 403 on PRs.
  issues: write


concurrency:
  # Cancel in-progress runs of this workflow on the same ref when a new
  # commit lands. A fast push cadence otherwise queues stale runs that
  # finish minutes after the developer moved on — wasting CI minutes.
  # Different branches / different PRs get their own group, so they do
  # not interfere with each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auto-merge:
    name: auto-merge patch and minor dep bumps
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 5
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and merge patch bumps
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr review --approve "$PR_URL" \
            --body "Auto-approved: patch dependency bump."
          # Prefer auto-merge so GitHub waits for required checks when
          # branch protection exists. GitHub refuses to ENABLE auto-merge
          # when nothing is left to wait for ("Pull request is in clean
          # status" — the repo has no branch protection) — in that case the
          # PR is already fully mergeable, so squash-merge it directly.
          # Any other failure is real and must stay visible.
          if OUT=$(gh pr merge --auto --squash "$PR_URL" \
                --body "Auto-merged: patch bump, all CI checks passed." 2>&1); then
            echo "$OUT"
          elif echo "$OUT" | grep -q "in clean status"; then
            gh pr merge --squash "$PR_URL" \
              --body "Auto-merged: patch bump, all CI checks passed."
          else
            echo "$OUT" >&2
            exit 1
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and merge minor bumps
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL" \
            --body "Auto-approved: minor dependency bump."
          # Same auto-merge-then-fallback logic as the patch step above.
          if OUT=$(gh pr merge --auto --squash "$PR_URL" \
                --body "Auto-merged: minor bump, all CI checks passed." 2>&1); then
            echo "$OUT"
          elif echo "$OUT" | grep -q "in clean status"; then
            gh pr merge --squash "$PR_URL" \
              --body "Auto-merged: minor bump, all CI checks passed."
          else
            echo "$OUT" >&2
            exit 1
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label major bumps for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          # Ensure the label exists before applying it. `gh label create
          # --force` creates it when missing and updates it when present,
          # so this step can never fail on a repo where the label has not
          # been provisioned yet (that failure mode used to crash the job:
          # "'needs-review' not found").
          gh label create "needs-review" \
            --color "D93F0B" \
            --description "Dependabot major bump — manual review required before merge" \
            --force
          gh pr edit "$PR_URL" --add-label "needs-review"
          gh pr comment "$PR_URL" \
            --body "Major bump detected — left for manual review. Check breaking changes before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # This job never checks out the repo, so gh must be told which
          # repository to act on — `gh label create` cannot resolve it
          # from a PR URL and would otherwise fail with "not a git
          # repository".
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
