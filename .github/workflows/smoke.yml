---
name: smoke

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SECRET_KEY: ci-not-a-secret
  POSTGRES_PASSWORD: ci-not-a-secret
  DOCUBOT_IMAGE: stacksmith-stub:ci
  CELERY_APP: stub
  NGINX_HTTP_PORT: "8080"

jobs:
  smoke:
    name: production stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the stub app image
        run: docker build -t stacksmith-stub:ci tests/stub-app

      - name: Bring up the production stack
        run: |
          docker compose \
            -f docker-compose.infra.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.override.yml \
            -p stacksmith up -d --wait --wait-timeout 180

      - name: Run migrations
        run: |
          docker compose \
            -f docker-compose.infra.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.override.yml \
            -p stacksmith exec -T app python manage.py migrate --noinput

      - name: Probe health endpoints through nginx
        run: |
          ok=""
          for i in $(seq 1 20); do
            live="$(curl -fsS http://127.0.0.1:8080/health/live/ || true)"
            ready="$(curl -fsS http://127.0.0.1:8080/health/ready/ || true)"
            if [ "$live" = "ok" ] \
              && printf '%s' "$ready" | grep -q '"postgres": "ok"' \
              && printf '%s' "$ready" | grep -q '"redis": "ok"'; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "health probes never passed"
            docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml \
              -f docker-compose.override.yml -p stacksmith ps -a
            docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml \
              -f docker-compose.override.yml -p stacksmith logs --tail=80
            exit 1
          fi
          echo "live + ready probes: ok"

      - name: Show final stack state
        run: |
          docker compose \
            -f docker-compose.infra.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.override.yml \
            -p stacksmith ps
