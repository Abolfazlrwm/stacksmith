---
name: smoke

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub:
    name: stub stack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the stub stack
        run: docker compose -f tests/smoke/docker-compose.yml up -d --wait
      - name: Probe /health
        run: |
          ok=""
          for i in $(seq 1 15); do
            if [ "$(curl -fsS http://127.0.0.1:8080/health)" = "ok" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "health probe never returned ok"
            docker compose -f tests/smoke/docker-compose.yml logs
            exit 1
          fi
          echo "health probe: ok"

  prod:
    name: prod stack
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cp .env.example .env
          sed -i 's/DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production-0123456789/' .env
          sed -i 's/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-test-password/' .env
          sed -i 's/DJANGO_ALLOWED_HOSTS=.*/DJANGO_ALLOWED_HOSTS=*/' .env
          sed -i 's/NGINX_HTTP_PORT=.*/NGINX_HTTP_PORT=8080/' .env
          sed -i 's/NGINX_HTTPS_PORT=.*/NGINX_HTTPS_PORT=8443/' .env

      - name: Bring up the prod stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait

      - name: Probe /health/live/ through nginx
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/live/ | grep -q '"alive"'; then
              echo "live probe: ok"
              exit 0
            fi
            sleep 2
          done
          echo "live probe failed"
          docker compose -f docker-compose.prod.yml logs --no-color || true
          exit 1

      - name: Probe /health/ready/ through nginx
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body="$(curl -s http://127.0.0.1:8080/health/ready/ || true)"
            if echo "$body" | grep -q '"ready"'; then
              echo "ready probe: ok ($body)"
              exit 0
            fi
            sleep 2
          done
          echo "ready probe failed"
          docker compose -f docker-compose.prod.yml logs --no-color || true
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down --remove-orphans -v

  deploy-drill:
    name: deploy + rollback drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cp .env.example .env
          sed -i 's/DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production-0123456789/' .env
          sed -i 's/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-test-password/' .env
          sed -i 's/DJANGO_ALLOWED_HOSTS=.*/DJANGO_ALLOWED_HOSTS=*/' .env
          sed -i 's/NGINX_HTTP_PORT=.*/NGINX_HTTP_PORT=8081/' .env

      - name: Bring up the stack (blue)
        run: docker compose -f docker-compose.prod.yml up -d --build --wait

      - name: Verify blue is serving
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/health/live/ | grep -q '"alive"'; then
              echo "blue is serving"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Deploy to green (with canary)
        run: |
          GRACE_PERIOD=3 CANARY_PROBES=3 CANARY_INTERVAL=1 NGINX_PORT=8081 \
            bash scripts/deploy.sh green
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/health/live/ | grep -q '"alive"'; then
              echo "green is serving"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml logs --no-color || true
          exit 1

      - name: Verify green is the active upstream
        run: |
          grep -q 'server app-green:8000' nginx/upstreams.conf || {
            echo "upstream not switched to green"; exit 1
          }
          echo "upstream is on green"

      - name: Roll back to blue (with canary)
        run: |
          GRACE_PERIOD=3 CANARY_PROBES=3 CANARY_INTERVAL=1 NGINX_PORT=8081 \
            bash scripts/rollback.sh
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/health/live/ | grep -q '"alive"'; then
              echo "blue is serving again"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml logs --no-color || true
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down --remove-orphans -v

  canary-failure-drill:
    name: canary failure → auto-rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cp .env.example .env
          sed -i 's/DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production-0123456789/' .env
          sed -i 's/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-test-password/' .env
          sed -i 's/DJANGO_ALLOWED_HOSTS=.*/DJANGO_ALLOWED_HOSTS=*/' .env
          sed -i 's/NGINX_HTTP_PORT=.*/NGINX_HTTP_PORT=8084/' .env

      - name: Bring up the stack (blue)
        run: docker compose -f docker-compose.prod.yml up -d --build --wait

      - name: Verify blue is serving
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8084/health/live/ | grep -q '"alive"' && exit 0
            sleep 2
          done
          exit 1

      - name: Start app-green, then break it so canary fails
        run: |
          docker compose -f docker-compose.prod.yml --profile green up -d --wait --no-deps app-green
          docker compose -f docker-compose.prod.yml exec -T app-green \
            curl -fsS http://127.0.0.1:8000/health/live/ | grep -q '"alive"'
          docker compose -f docker-compose.prod.yml exec -T app-green \
            sh -c 'pkill -f gunicorn || true'
          sleep 2
          echo "app-green broken — canary should fail"

      - name: Deploy to green (expected to fail canary and roll back)
        run: |
          set +e
          GRACE_PERIOD=3 CANARY_PROBES=3 CANARY_INTERVAL=1 NGINX_PORT=8084 \
            bash scripts/deploy.sh green
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: deploy.sh succeeded but canary should have failed"
            exit 1
          fi
          echo "deploy.sh exited $rc (expected non-zero) — canary caught the bad release"

      - name: Verify blue is still the active upstream
        run: |
          grep -q 'server app-blue:8000' nginx/upstreams.conf || {
            echo "upstream was not rolled back to blue"; exit 1
          }
          echo "upstream is back on blue"

      - name: Verify blue is still serving traffic
        run: |
          curl -fsS http://127.0.0.1:8084/health/live/ | grep -q '"alive"' || {
            echo "blue is not serving after rollback"; exit 1
          }
          echo "blue still serving"

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down --remove-orphans -v
