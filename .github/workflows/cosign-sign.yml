---
name: cosign-sign

# Runs AFTER registry-build completes, so the image exists in GHCR.
on:
  workflow_run:
    workflows: ["registry-build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  sign:
    name: cosign sign and attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/app
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: |
          echo "name=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the image with keyless cosign
        run: |
          IMG="${{ steps.image.outputs.name }}"
          DIGEST=$(docker buildx imagetools inspect "$IMG:latest" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "Signing $IMG@$DIGEST"
          cosign sign --yes "$IMG@$DIGEST"

      - name: Generate and attach SBOM attestation
        run: |
          IMG="${{ steps.image.outputs.name }}"
          DIGEST=$(docker buildx imagetools inspect "$IMG:latest" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft "$IMG@$DIGEST" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json \
            --type spdxjson "$IMG@$DIGEST"
          echo "SBOM attestation attached"

      - name: Wait for registry propagation
        run: sleep 15

      - name: Verify the signature (non-blocking)
        continue-on-error: true
        run: |
          IMG="${{ steps.image.outputs.name }}"
          DIGEST=$(docker buildx imagetools inspect "$IMG:latest" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign verify \
            --certificate-identity-regexp \
            "https://github.com/${{ github.repository }}/.github/.+" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com" \
            "$IMG@$DIGEST"
          echo "Signature verified"
