---
name: chaos-drill

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE: docker compose -f docker-compose.prod.yml

jobs:
  chaos:
    name: kill worker → verify app survives → restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cp .env.example .env
          sed -i 's/DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-chaos-secret/' .env
          sed -i 's/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-chaos-pass/' .env
          sed -i 's/DJANGO_ALLOWED_HOSTS=.*/DJANGO_ALLOWED_HOSTS=*/' .env
          sed -i 's/NGINX_HTTP_PORT=.*/NGINX_HTTP_PORT=8091/' .env

      - name: Bring up the stack
        run: $COMPOSE up -d --build --wait

      - name: Verify baseline health
        run: |
          curl -fsS http://127.0.0.1:8091/health/live/ | grep -q '"alive"'
          curl -fsS http://127.0.0.1:8091/health/ready/ | grep -q '"ready"'
          echo "baseline healthy"

      - name: Kill the worker process (simulate OOM)
        run: |
          echo "[chaos] killing worker main process (PID 1)"
          $COMPOSE exec -T worker sh -c 'kill -9 1' || true
          sleep 3
          echo "[chaos] worker killed"

      - name: Verify app still serves with worker down
        run: |
          # The app must keep serving /health even with the worker dead.
          # This proves the app is not coupled to the worker.
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8091/health/live/ \
              | grep -q '"alive"'; then
              echo "app still serving after worker kill"
              exit 0
            fi
            sleep 2
          done
          echo "app stopped serving after worker kill"
          exit 1

      - name: Restart the worker
        run: |
          $COMPOSE up -d --no-deps worker
          sleep 3
          docker inspect stacksmith-worker-1 \
            --format '{{.State.Running}}' | grep -q true \
            && echo "worker restarted"

      - name: Stop nginx and verify outage
        run: |
          echo "[chaos] stopping nginx"
          docker stop stacksmith-nginx-1 || true
          sleep 1
          # The app should NOT be reachable now (nginx is the entry point).
          if curl -fsS http://127.0.0.1:8091/health/live/ 2>/dev/null; then
            echo "ERROR: app still reachable with nginx down"
            exit 1
          fi
          echo "app correctly unreachable with nginx down"

      - name: Restart nginx and verify recovery
        run: |
          $COMPOSE up -d --no-deps nginx
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8091/health/live/ \
              | grep -q '"alive"'; then
              echo "nginx recovered after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "nginx did not recover"
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --no-color || true

      - name: Tear down
        if: always()
        run: $COMPOSE down --remove-orphans -v
