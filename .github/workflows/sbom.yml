---
name: sbom

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: generate SBOM with syft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cp .env.example .env
          sed -i 's/DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-sbom-secret/' .env
          sed -i 's/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-sbom-pass/' .env

      - name: Build the app image
        run: docker compose -f docker-compose.prod.yml build app-blue

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft stacksmith/app:latest -o spdx-json > sbom.spdx.json
          echo "SBOM generated: $(jq '.packages | length' sbom.spdx.json) packages"

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft stacksmith/app:latest -o cyclonedx-json > sbom.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 30

      - name: Scan SBOM with grype for known vulnerabilities
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin
          grype stacksmith/app:latest -o json > grype-results.json || true
          echo "Vulnerabilities found:"
          jq '.matches | length' grype-results.json
          echo "Critical/High:"
          jq '[.matches[] | .vulnerability.severity | test("Critical|High")] | length' grype-results.json || true

      - name: Upload grype results
        uses: actions/upload-artifact@v4
        with:
          name: grype-results
          path: grype-results.json
          retention-days: 30
