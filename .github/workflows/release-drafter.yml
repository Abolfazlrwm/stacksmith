---
name: release-drafter

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  # Creating/updating the draft release on pushes to main needs
  # contents:write — the API rejects release creation for a
  # read-only token with "Resource not accessible by integration".
  contents: write
  pull-requests: write


concurrency:
  # Cancel in-progress runs of this workflow on the same ref when a new
  # commit lands. A fast push cadence otherwise queues stale runs that
  # finish minutes after the developer moved on — wasting CI minutes.
  # Different branches / different PRs get their own group, so they do
  # not interfere with each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update-draft:
    name: update release draft
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
