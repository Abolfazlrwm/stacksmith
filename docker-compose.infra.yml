---
# Long-lived tier: edge (nginx) + data (postgres, redis). These run outside
# the blue/green app slots so a release never restarts them - see ADR-0002
# (lands with phase 2). The fixed network name is what lets the app-tier
# slots join the same networks.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg17
    # Tuned for a small dedicated VPS (8 GB class): modest shared buffers,
    # headroom for app + worker + drills. These flags are the whole config;
    # no custom postgres.conf to drift.
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=120
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docubot}
      POSTGRES_USER: ${POSTGRES_USER:-docubot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-docubot} -d $${POSTGRES_DB:-docubot}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis:7-alpine
    # noeviction on purpose: this is a celery broker, dropping keys to stay
    # under the limit would silently lose tasks. If the limit is hit, that
    # is an incident, not a cache miss. AOF on: the broker survives a
    # container restart without losing queued tasks.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redisdata:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - backend

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/upstreams.conf:/etc/nginx/upstreams.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s
    logging: *default-logging
    networks:
      - backend

volumes:
  pgdata:
    name: stacksmith_pgdata
  redisdata:
    name: stacksmith_redisdata

networks:
  backend:
    name: stacksmith_backend
