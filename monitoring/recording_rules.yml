# Prometheus recording rules — pre-computed metrics for faster dashboards
# and more efficient alerts. Loaded by prometheus.yml.
groups:
  - name: stacksmith-recording
    interval: 30s
    rules:
      # CPU utilization per container (as a percentage of one core).
      - record: container:cpu_usage_percent
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100

      # Memory usage per container (in MB).
      - record: container:memory_usage_mb
        expr: container_memory_usage_bytes{name!=""} / 1024 / 1024

      # Host CPU utilization (percentage).
      - record: host:cpu_usage_percent
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100

      # Host memory utilization (percentage).
      - record: host:memory_usage_percent
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100

      # Host disk utilization (percentage, root filesystem).
      - record: host:disk_usage_percent
        expr: >-
          100 - (
            node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            * 100
          )

      # 5-minute request rate through nginx (requests per second).
      # nginx-exporter exposes nginx_http_requests_total as a single
      # counter with no labels (OSS stub_status limitation, ADR-0034),
      # so this is the total request rate — not split by status code.
      - record: nginx:request_rate_5m
        expr: sum(rate(nginx_http_requests_total[5m]))

      # --- latency + per-status SLI from promtail (ADR-0035) ---
      # promtail's metrics pipeline derives these from the nginx JSON
      # access log ($request_time and $status). This is the source that
      # ADR-0034 said OSS stub_status could not provide, unblocking the
      # latency P99 SLO and a real 5xx error ratio.

      # P99 latency through nginx over 5m, in milliseconds.
      - record: nginx:p99_latency_ms_5m
        expr: >-
          histogram_quantile(0.99,
            sum(rate(nginx_log_request_duration_seconds_bucket[5m])) by (le)
          ) * 1000

      # P50 / P95 for the dashboard bands.
      - record: nginx:p50_latency_ms_5m
        expr: >-
          histogram_quantile(0.50,
            sum(rate(nginx_log_request_duration_seconds_bucket[5m])) by (le)
          ) * 1000
      - record: nginx:p95_latency_ms_5m
        expr: >-
          histogram_quantile(0.95,
            sum(rate(nginx_log_request_duration_seconds_bucket[5m])) by (le)
          ) * 1000

      # 5xx error ratio over 5m — the per-status SLI that ADR-0034
      # deferred. nginx_log_requests_total is labeled by status, so we
      # can finally compute the real error rate, not just "is it down".
      - record: nginx:error_rate_5xx_5m
        expr: >-
          sum(rate(nginx_log_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(nginx_log_requests_total[5m])), 1)

      # 30-day 5xx ratio — the error-budget numerator (ADR-0033's
      # original intent, now computable). Used by the availability SLO
      # as a quality signal layered on top of the outage SLI.
      - record: nginx:error_rate_5xx_30d
        expr: >-
          sum(rate(nginx_log_requests_total{status=~"5.."}[30d]))
          / clamp_min(sum(rate(nginx_log_requests_total[30d])), 1)

      # Availability SLI: blackbox probe success to /health/live/.
      # We use probe_success (1 = up, 0 = down) averaged over 5m. This
      # catches outages, not partial 5xx errors — see ADR-0034 for why
      # OSS nginx cannot give us a per-status-code breakdown without
      # either NGINX Plus or a log-parsing pipeline.
      - record: slo:availability_5m
        expr: avg_over_time(probe_success[5m])

      # 30-day availability (the SLO window).
      - record: slo:availability_30d
        expr: avg_over_time(probe_success[30d])

      # Error budget remaining: 0.5% allowed downtime over 30d.
      # A 99.5% SLO means availability can be as low as 0.995; budget
      # used = (1 - availability) / 0.005, capped at 1.
      - record: slo:error_budget_used_ratio
        expr: clamp_max((1 - slo:availability_30d) / 0.005, 1)

      # Active nginx connections (gauge, from stub_status).
      - record: nginx:connections_active
        expr: nginx_connections_active

      # Backup freshness in hours.
      - record: backup:age_hours
        expr: (time() - backup_last_success_timestamp_seconds) / 3600

      # Container restart count in the last hour.
      - record: container:restarts_1h
        expr: increase(container_restart_count{name!=""}[1h])

      # Maintenance mode status.
      - record: stacksmith:maintenance_active
        expr: stacksmith_maintenance_active
