---
# Alert rules for the docubot stack.
groups:
  - name: stacksmith-backup
    rules:
      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds > 93600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Database backup is stale"
          description: "No successful backup in over 26 hours. Check the stacksmith-backup timer."

      - alert: BackupFailed
        expr: backup_last_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Last backup reported failure"
          description: "backup_last_status is 0 — the most recent backup-db.sh run failed."

  - name: stacksmith-saturation
    rules:
      - alert: HostDiskFull
        expr: >-
          100 - (
            node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            * 100
          ) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host disk > 85% full"
          description: "Root filesystem on {{ $labels.instance }} is above 85% for 10m."

      - alert: HostMemoryFull
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory > 90% used"

  - name: stacksmith-restarts
    rules:
      - alert: ContainerRestartStorm
        expr: increase(container_restart_count{name!=""}[5m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted more than 3 times in 5m"

  - name: stacksmith-availability
    rules:
      - alert: AppHealthProbeFailing
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Health probe failing"
          description: "The blackbox probe to /health/live/ has been failing for 2m."

      - alert: High5xxRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate through nginx"
          description: "More than 0.1 req/s of 5xx responses for 5m."

  # --- SLO / error budget (ADR-0033, ADR-0034) ---
  # SLO: 99.5% availability over 30 days → 3.6h error budget per month.
  # SLI: blackbox probe_success to /health/live/. The OSS nginx
  # stub_status endpoint does NOT expose per-status-code request counts
  # (only the total), so we measure availability as "the health probe
  # succeeded", not "no 5xx". This catches outages and slow shutdowns,
  # not partial 5xx errors — see ADR-0034 for the trade-off and the
  # log-parsing pipeline that would close the gap.
  - name: stacksmith-slo
    rules:
      - alert: SLOAvailabilityDown
        # Fast-burn detector: probe failing for 2m means an outage
        # is burning the budget ~22x faster than the SLO allows.
        expr: avg_over_time(probe_success[2m]) < 0.5
        for: 0m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "SLO fast burn — health probe failing"
          description: >-
            The blackbox probe to /health/live/ has been failing for 2
            minutes. The 30-day availability error budget (0.5%, ~3.6h)
            is being burned ~22x faster than allowed. Page and
            investigate the nginx and app-blue containers.

      - alert: SLOErrorBudgetExhausted
        # 30-day availability below the 99.5% SLO threshold.
        expr: slo:availability_30d < 0.995
        for: 10m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "SLO error budget exhausted over 30d"
          description: >-
            The 30-day availability (probe_success average) has dropped
            below the 99.5% SLO. No more error budget remains for the
            rest of the month — deploys should be more careful. Check
            the SLO dashboard for the burn trend.

      # --- latency SLO (re-introduced by ADR-0035) ---
      # The promtail metrics pipeline derives nginx_log_request_duration_seconds
      # (a Histogram) from nginx's $request_time in the JSON access log.
      # This is the source ADR-0034 said OSS stub_status could not
      # provide. P99 must stay under 500ms for 5m to avoid a page.
      - alert: SLOLatencyP99Breach
        expr: nginx:p99_latency_ms_5m > 500
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "SLO latency P99 above 500ms"
          description: >-
            P99 request latency through nginx exceeded 500ms for the
            last 5 minutes. User-visible slowness. Check the SLO
            dashboard's latency band panel and the app-blue container
            for slow queries or a stuck worker.

      # --- 5xx quality SLO (re-introduced by ADR-0035) ---
      # The promtail metrics pipeline derives nginx_log_requests_total
      # with a status label, so we can finally compute the 5xx ratio
      # that ADR-0033 originally wanted. This is a quality signal layered
      # on top of the outage SLO above: a 30% 5xx rate with the health
      # endpoint up would not trip SLOAvailabilityDown, but it trips
      # this. The threshold (2% for 2m) is the fast-burn line.
      - alert: SLOHigh5xxRate
        expr: nginx:error_rate_5xx_5m > 0.02
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "SLO high 5xx rate — quality burn"
          description: >-
            The 5xx ratio through nginx exceeded 2% for 2 minutes. This
            burns the 30-day error budget 14x faster than the SLO
            allows. The health probe may still be up (so
            SLOAvailabilityDown has not fired), but users are seeing
            errors. Page and investigate app-blue.
