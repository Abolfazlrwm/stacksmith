---
# Alert rules for the docubot stack.
groups:
  - name: stacksmith-backup
    rules:
      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds > 93600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Database backup is stale"
          description: "No successful backup in over 26 hours. Check the stacksmith-backup timer."

      - alert: BackupFailed
        expr: backup_last_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Last backup reported failure"
          description: "backup_last_status is 0 — the most recent backup-db.sh run failed."

  - name: stacksmith-saturation
    rules:
      - alert: HostDiskFull
        expr: >-
          100 - (
            node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            * 100
          ) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host disk > 85% full"
          description: "Root filesystem on {{ $labels.instance }} is above 85% for 10m."

      - alert: HostMemoryFull
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory > 90% used"

  - name: stacksmith-restarts
    rules:
      - alert: ContainerRestartStorm
        expr: increase(container_restart_count{name!=""}[5m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted more than 3 times in 5m"

  - name: stacksmith-availability
    rules:
      - alert: AppHealthProbeFailing
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Health probe failing"
          description: "The blackbox probe to /health/live/ has been failing for 2m."

      - alert: High5xxRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate through nginx"
          description: "More than 0.1 req/s of 5xx responses for 5m."

  # --- SLO / error budget (ADR-0033) ---
  # SLO: 99.5% availability over 30 days → 3.6h error budget per month.
  # SLI: ratio of non-5xx requests to total requests through nginx.
  # The 30d window means a new deployment does not immediately trip; the
  # 5m window is the fast-burn detector for active incidents.
  - name: stacksmith-slo
    rules:
      - alert: SLOErrorBudgetBurnFast
        expr: |
          (
            sum(rate(nginx_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(nginx_http_requests_total[5m])), 1)
          ) > 0.02
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "SLO fast burn — error rate above 2% for 2m"
          description: >-
            The 5xx ratio through nginx exceeds 2% for 2 minutes. This burns
            the 30-day error budget 14x faster than allowed. Page and
            investigate.

      - alert: SLOErrorBudgetExhausted
        expr: |
          (
            1 -
            (
              sum(rate(nginx_http_requests_total{status!~"5.."}[30d]))
              /
              clamp_min(sum(rate(nginx_http_requests_total[30d])), 1)
            )
          ) > 0.005
        for: 10m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "SLO error budget exhausted over 30d"
          description: >-
            The 30-day 5xx ratio exceeds the 0.5% SLO threshold. No more
            error budget remains for the rest of the month — deploys should
            be more careful.

      - alert: SLOLatencyP99Breach
        # P99 latency through nginx must stay under 500ms.
        expr: |
          histogram_quantile(0.99,
            sum(rate(nginx_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "SLO latency P99 above 500ms"
          description: >-
            P99 latency through nginx exceeds 500ms for 5m. User-visible
            slowness.
