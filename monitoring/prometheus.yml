---
# Prometheus scrape config for the docubot stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: stacksmith

rule_files:
  - alert_rules.yml
  - recording_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  # nginx-exporter — the SLI source for the SLO dashboard (ADR-0033).
  # Exposes nginx_connections_active, nginx_http_requests_total (no
  # labels), and friends on :9113. Connection-level only.
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # promtail — the latency SLI source (ADR-0035). promtail's metrics
  # pipeline stage derives nginx_log_request_duration_seconds
  # (Histogram, from nginx $request_time in the JSON access log) and
  # nginx_log_requests_total (Counter, with status label) from the
  # nginx access log. This is the source that lets us compute P99
  # latency and a per-status-code error ratio — the two things
  # stub_status could not give us (ADR-0034).
  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: app
    metrics_path: /health/metrics
    static_configs:
      - targets: ["app-blue:8000", "app-green:8000"]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://nginx/health/live/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
