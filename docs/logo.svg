<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="docubot logo">
  <!-- Document spine + chat bubble. Warm ink + ochre accent, matching
       the app palette (see demo.html :root). Square corners (engineer
       aesthetic), no glow, no gradient on the bubble — flat fill. -->
  <!-- square background -->
  <rect width="64" height="64" fill="#171421"/>

  <!-- document: page with a folded corner -->
  <path d="M16 14 h20 l8 8 v28 a2 2 0 0 1 -2 2 h-26 a2 2 0 0 1 -2 -2 v-34 a2 2 0 0 1 2 -2 z"
        fill="#211e2b" stroke="#423d4f" stroke-width="1.5"/>
  <path d="M36 14 l8 8 h-8 z" fill="#423d4f"/>

  <!-- text lines on the document -->
  <rect x="20" y="28" width="16" height="2.5" fill="#d4a055"/>
  <rect x="20" y="34" width="20" height="2.5" fill="#6e6a62"/>
  <rect x="20" y="40" width="12" height="2.5" fill="#6e6a62"/>

  <!-- chat bubble (the RAG answer) — flat ochre, no gradient -->
  <path d="M40 38 c6 0 10 4 10 9 c0 5 -4 9 -10 9 c-2 0 -3 0 -5 -1 l-4 2 l1 -4 c-2 -2 -2 -4 -2 -6 c0 -5 4 -9 10 -9 z"
        fill="#d4a055"/>
  <circle cx="37" cy="47" r="1.5" fill="#171421"/>
  <circle cx="42" cy="47" r="1.5" fill="#171421"/>
  <circle cx="47" cy="47" r="1.5" fill="#171421"/>
</svg>
