# Production compose stack for the docubot backend — Phase 2.
# Blue-green app instances; deploy.sh switches the nginx upstream between them.
---
x-logging: &logdriver
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &appdef
  build:
    context: ./app
    dockerfile: Dockerfile
  image: ${APP_IMAGE:-stacksmith/app:latest}
  env_file: .env
  command: /app/entrypoint.sh
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/live/ || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  logging: *logdriver

services:
  app-blue:
    <<: *appdef

  app-green:
    <<: *appdef
    profiles: ["green"]

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: stacksmith/app:latest
    env_file: .env
    command: celery -A config worker -l info --concurrency 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logdriver

  beat:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: stacksmith/app:latest
    env_file: .env
    command: celery -A config beat -l info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logdriver

  postgres:
    image: pgvector/pgvector:pg17
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logdriver

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logdriver

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      app-blue:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logdriver

  # nginx-exporter scrapes the /stub_status endpoint exposed by nginx
  # and serves Prometheus-format metrics on :9113. This is the SLI
  # source the SLO dashboard (ADR-0033, ADR-0034) depends on. Lives in
  # the prod compose (not monitoring) because it is part of the
  # production deployment unit and must start *after* nginx via
  # depends_on, which only works when both services are in the same
  # compose file. prometheus (in monitoring compose) scrapes it.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    logging: *logdriver

volumes:
  pgdata:
    name: stacksmith_pgdata
