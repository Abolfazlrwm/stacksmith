---
# App tier: one release slot. deploy.sh sets the compose project name
# (stacksmith-blue / stacksmith-green) and APP_SLOT, which is what the nginx
# upstream points at. In single-project mode (make up) the slot name is just
# "blue" and everything runs as one stack.

x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  POSTGRES_DB: ${POSTGRES_DB:-docubot}
  POSTGRES_USER: ${POSTGRES_USER:-docubot}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_APP: ${CELERY_APP:-config}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${DOCUBOT_IMAGE:-ghcr.io/abolfazlrwm/docubot:latest}
    environment: *app-env
    # urllib instead of curl: any python image passes this, docubot's or ours
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request, sys;
          sys.exit(0 if urllib.request.urlopen(sys.argv[1], timeout=3).status == 200 else 1)"
          http://127.0.0.1:8000/health/live/
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      backend:
        aliases:
          - docubot-app-${APP_SLOT:-blue}

  worker:
    image: ${DOCUBOT_IMAGE:-ghcr.io/abolfazlrwm/docubot:latest}
    command: sh -c 'celery -A "$${CELERY_APP:-config}" worker -l info --concurrency=2'
    environment: *app-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A '$${CELERY_APP:-config}' inspect ping -d \"celery@$$(hostname)\" | grep -qi pong"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - backend

  beat:
    image: ${DOCUBOT_IMAGE:-ghcr.io/abolfazlrwm/docubot:latest}
    command: sh -c 'celery -A "$${CELERY_APP:-config}" beat -l info --schedule /tmp/celerybeat-schedule'
    environment: *app-env
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - backend

networks:
  backend:
    name: stacksmith_backend
