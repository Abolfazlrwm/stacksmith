# Tuned postgres config for a single-VPS docubot deployment.
# Adjust shared_buffers / work_mem to the host RAM.

# Connections
max_connections = 100
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# Memory (tune to host: ~25% of RAM for shared_buffers)
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 1536MB

# WAL / replication
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# Query planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging (json-file on the container handles rotation)
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = "%m [%p] %u@%d "

# Autovacuum
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
